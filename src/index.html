<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plank Flooring Layout Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%238B4513'/><rect x='1' y='1' width='14' height='9' fill='%23DEB887' rx='1'/><rect x='17' y='1' width='14' height='9' fill='%23D2B48C' rx='1'/><rect x='1' y='12' width='9' height='9' fill='%23D2B48C' rx='1'/><rect x='12' y='12' width='9' height='9' fill='%23DEB887' rx='1'/><rect x='23' y='12' width='8' height='9' fill='%23D2B48C' rx='1'/><rect x='1' y='23' width='14' height='8' fill='%23D2B48C' rx='1'/><rect x='17' y='23' width='14' height='8' fill='%23DEB887' rx='1'/></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <h1>Plank Flooring Layout Calculator</h1>
        <form id="calculator-form">
            <fieldset>
                <legend>Room Dimensions</legend>
                <label for="room-length">Room Length (ft):</label>
                <input type="number" id="room-length" step="0.01" required>
                
                <label for="room-width">Room Width (ft):</label>
                <input type="number" id="room-width" step="0.01" required>
            </fieldset>
            
            <fieldset>
                <legend>Flooring Plank Dimensions</legend>
                <label for="plank-length">Plank Length (in):</label>
                <input type="number" id="plank-length" step="0.01" required>
                
                <label for="plank-width">Plank Width (in):</label>
                <input type="number" id="plank-width" step="0.01" required>
            </fieldset>
            
            <fieldset>
                <legend>Installation Settings</legend>
                <label for="perimeter-spacing">Perimeter Spacing (in):</label>
                <input type="number" id="perimeter-spacing" step="0.01" value="0.25" required>
                <small>Expansion gap required around walls</small>
            </fieldset>
            
            <button type="submit">Calculate</button>
        </form>
        <div id="results">
            <h2>Results</h2>
            <div id="layout-visualization"></div>
        </div>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
